[project]
name = "dorq"
version = "0.1.0"
description = "Research-to-strategy backtesting platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "aiofiles",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "docling>=2.93.0",
    "litellm>=1.83.14",
    "alpaca-py>=0.43.4",
    "pandas>=3.0.3",
    "numpy>=2.2.6",
    "pandas-ta>=0.4.71b0",
    "vectorbt>=0.28.2",
    "plotly>=6.7.0",
    "kaleido>=1.3.0",
    "sentry-sdk[fastapi]>=2.59.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
