[project]
name = "dorq"
version = "0.1.0"
description = "Research-to-strategy backtesting platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "aiofiles",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "docling>=2.93.0",
    "litellm>=1.83.14",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
